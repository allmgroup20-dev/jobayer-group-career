name: Deploy AI Worker

on:
  push:
    branches: [main]
    paths:
      - "ai-app/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ai-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-app/package-lock.json

      - run: npm ci

      - name: Build & Deploy
        run: npm run build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set WhatsApp & AI secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          for item in \
            "WHATSAPP_VERIFY_TOKEN|$WHATSAPP_VERIFY_TOKEN" \
            "WHATSAPP_API_KEY|$WHATSAPP_API_KEY" \
            "WHATSAPP_PHONE_ID|$WHATSAPP_PHONE_ID" \
            "WHATSAPP_APP_SECRET|$WHATSAPP_APP_SECRET" \
            "HUGGINGFACE_API_KEY|$HUGGINGFACE_API_KEY" \
            "CRON_SECRET|$CRON_SECRET"
          do
            name="${item%%|*}"
            value="${item#*|}"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            fi
          done

      - name: Set AI secrets
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then echo "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY; fi
          if [ -n "${{ secrets.HUGGINGFACE_API_KEY }}" ]; then echo "${{ secrets.HUGGINGFACE_API_KEY }}" | npx wrangler secret put HUGGINGFACE_API_KEY; fi
          if [ -n "${{ secrets.WHATSAPP_VERIFY_TOKEN }}" ]; then echo "${{ secrets.WHATSAPP_VERIFY_TOKEN }}" | npx wrangler secret put WHATSAPP_VERIFY_TOKEN; fi
          if [ -n "${{ secrets.WHATSAPP_API_KEY }}" ]; then echo "${{ secrets.WHATSAPP_API_KEY }}" | npx wrangler secret put WHATSAPP_API_KEY; fi
          if [ -n "${{ secrets.WHATSAPP_PHONE_ID }}" ]; then echo "${{ secrets.WHATSAPP_PHONE_ID }}" | npx wrangler secret put WHATSAPP_PHONE_ID; fi
          if [ -n "${{ secrets.WHATSAPP_HASH_SECRET }}" ]; then echo "${{ secrets.WHATSAPP_HASH_SECRET }}" | npx wrangler secret put WHATSAPP_HASH_SECRET; fi
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
