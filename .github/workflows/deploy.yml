name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & Deploy
        run: npm run build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set chat secret
        run: |
          if [ -n "$CHAT_API_SECRET" ]; then echo "$CHAT_API_SECRET" | npx wrangler secret put CHAT_API_SECRET; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_API_SECRET: ${{ secrets.CHAT_API_SECRET }}

      - name: Set OAuth vars
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then npx wrangler vars put GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"; fi
          if [ -n "$FACEBOOK_APP_ID" ]; then npx wrangler vars put FACEBOOK_APP_ID "$FACEBOOK_APP_ID"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}

      - name: Set secrets
        run: |
          if [ -n "$JWT_SECRET" ]; then echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY; fi
          if [ -n "$WHATSAPP_API_KEY" ]; then echo "$WHATSAPP_API_KEY" | npx wrangler secret put WHATSAPP_API_KEY; fi
          if [ -n "$WHATSAPP_PHONE_ID" ]; then echo "$WHATSAPP_PHONE_ID" | npx wrangler secret put WHATSAPP_PHONE_ID; fi
          if [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then echo "$WHATSAPP_VERIFY_TOKEN" | npx wrangler secret put WHATSAPP_VERIFY_TOKEN; fi
          if [ -n "$SSLCOMMERZ_STORE_ID" ]; then echo "$SSLCOMMERZ_STORE_ID" | npx wrangler secret put SSLCOMMERZ_STORE_ID; fi
          if [ -n "$SSLCOMMERZ_STORE_PASSWORD" ]; then echo "$SSLCOMMERZ_STORE_PASSWORD" | npx wrangler secret put SSLCOMMERZ_STORE_PASSWORD; fi
          if [ -n "$FACEBOOK_APP_SECRET" ]; then echo "$FACEBOOK_APP_SECRET" | npx wrangler secret put FACEBOOK_APP_SECRET; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
